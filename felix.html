<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: skyblue;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            padding: 38px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h2 {
            color: green;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #168ac0;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            background: navy;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #056600;
        }

        #message {
            color: green;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="off"
        >

        <button type="button" onclick="login()">Login</button>

        <p id="message"></p>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value.trim();
            const message = document.getElementById("message");

            message.textContent = "Bro joined the gym to burn fat, but after seeing the treadmill speed, he switched to the couch press. 💀😂";
            message.style.color = "green";
        }
    </script>
</body>
</html>
