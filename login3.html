<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxury Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:linear-gradient(-45deg,#0f0f0f,#1a1a1a,#2c1f0b,#0f0f0f);
background-size:400% 400%;
animation:bgMove 12s infinite ease;
}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

body::before{

content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#d4af37 0%,transparent 70%);
opacity:.08;
animation:rotate 18s linear infinite;
}

@keyframes rotate{

100%{
transform:rotate(360deg);
}

}

.card{

width:420px;
height:520px;

position:relative;

background:rgba(255,255,255,.06);

backdrop-filter:blur(20px);

border:1px solid rgba(212,175,55,.3);

border-radius:25px;

overflow:hidden;

box-shadow:0 20px 60px rgba(0,0,0,.6);

}

.page{

position:absolute;
width:100%;
height:100%;

padding:50px;

display:flex;
flex-direction:column;
justify-content:center;

transition:.7s;
}

.page2{

left:100%;
}

.card.active .page1{

left:-100%;
opacity:0;
}

.card.active .page2{

left:0;
}

.logo{

font-family:'Cinzel',serif;
font-size:32px;
letter-spacing:3px;
color:#d4af37;
margin-bottom:10px;
text-align:center;
}

.subtitle{

text-align:center;
color:#ddd;
margin-bottom:40px;
font-size:14px;
}

.input{

width:100%;
padding:15px;

margin:10px 0;

background:rgba(255,255,255,.08);

border:1px solid rgba(212,175,55,.4);

border-radius:10px;

color:white;

font-size:15px;

outline:none;
}

.input::placeholder{

color:#bbb;
}

.btn{

margin-top:25px;

padding:15px;

border:none;

border-radius:10px;

background:linear-gradient(90deg,#d4af37,#f6d365);

color:black;

font-weight:bold;

font-size:16px;

cursor:pointer;

transition:.3s;
}

.btn:hover{

transform:translateY(-3px);

box-shadow:0 0 25px rgba(212,175,55,.6);

}

.links{

margin-top:25px;

display:flex;

justify-content:space-between;

font-size:14px;
}

.links a{

color:#d4af37;

text-decoration:none;
}

.links a:hover{

text-decoration:underline;
}

.show{

display:flex;

align-items:center;

margin-top:15px;

color:white;

font-size:14px;
}

.show input{

margin-right:8px;
}

.fade{

animation:fade .8s;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.footer{

margin-top:30px;

text-align:center;

font-size:14px;

color:#ccc;
}

.footer a{

color:#d4af37;
text-decoration:none;
}

.footer a:hover{

text-decoration:underline;
}

</style>

</head>

<body>

<div class="card" id="card">

<!-- PAGE 1 -->

<div class="page page1 fade">

<div class="logo">
LUXORA
</div>

<div class="subtitle">
Exclusive Member Access
</div>

<input
class="input"
type="email"
id="email"
placeholder="Username or Email">

<button class="btn" onclick="nextPage()">
Continue →
</button>

<div class="footer">

Don't have an account?

<a href="#">Create Account</a>

</div>

</div>

<!-- PAGE 2 -->

<div class="page page2 fade">

<div class="logo">
Welcome
</div>

<div class="subtitle" id="displayEmail">
</div>

<input
class="input"
type="password"
id="password"
placeholder="Password">

<div class="show">

<input
type="checkbox"
onclick="togglePassword()">

Show Password

</div>

<button
class="btn"
onclick="login()">

Sign In

</button>

<div class="links">

<a href="#">Forgot Password?</a>

<a href="#" onclick="backPage()">
← Back
</a>

</div>

</div>

</div>

<script>

function nextPage(){

let email=document.getElementById("email").value;

if(email==""){

alert("Please enter your username or email.");

return;

}

document.getElementById("displayEmail").innerHTML=email;

document.getElementById("card").classList.add("active");

}

function backPage(){

document.getElementById("card").classList.remove("active");

}

function togglePassword(){

let p=document.getElementById("password");

p.type=(p.type=="password")?"text":"password";

}

function login(){

let password=document.getElementById("password").value;

if(password==""){

alert("Enter your password.");

return;

}

const btn=document.querySelector(".page2 .btn");

btn.innerHTML="Signing In...";

btn.disabled=true;

setTimeout(function(){

alert("Welcome to Luxora!");

btn.innerHTML="Sign In";

btn.disabled=false;

},2000);

}

</script>

</body>
</html>
